{% extends 'core/base.html' %}

{% block title %}Dashboard | Vendas CRM{% endblock %}

{% block content %}
<section>
    <p class="eyebrow">Dashboard</p>
    <h2>Indicadores principais</h2>
    <div class="stats">
        <div class="stat">
            <span class="muted">Total de Produtos</span>
            <strong>{{ total_produtos }}</strong>
        </div>
        <div class="stat">
            <span class="muted">Total de Vendas</span>
            <strong>{{ total_vendas }}</strong>
        </div>
    </div>
</section>
{% endblock %}
