# Render Blueprint specification: https://render.com/docs/blueprint-spec
#
# Create a new "Blueprint" instance in the Render dashboard and point it to
# this repository to provision the PostgreSQL database and the web service
# below. Values marked with `sync: false` are secrets and must be filled in
# the Render dashboard (they are never stored in the repository).
#
# The `main` branch is the deploy branch. Merge `develop` into `main` to ship
# a new version (autoDeploy is enabled).

databases:
  - name: vendas-crm-db
    databaseName: vendas_crm
    user: vendas_crm
    plan: free
    region: oregon

services:
  - type: web
    name: vendas-crm
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: bash build.sh
    startCommand: gunicorn main.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: vendas-crm-db
          property: connectionString
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
