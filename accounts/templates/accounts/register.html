{% extends 'core/base.html' %}

{% block title %}Registro | Vendas CRM{% endblock %}

{% block content %}
<div class="grid cols-2">
    <div class="card">
        <p class="eyebrow">Cadastro</p>
        <h2>Crie sua conta</h2>
        <p class="muted">Depois do cadastro, entre no sistema para acessar o CRM.</p>
    </div>
    <div class="card">
        <h2>Registro</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Registrar</button>
        </form>
        <p class="muted">Ja tem conta? <a href="{% url 'login' %}">Faça login</a></p>
        <!-- <p>Esqueceu sua senha? <a href="{% url 'password_reset' %}">Redefinir senha</a></p> -->
    </div>
</div>
{% endblock %}
