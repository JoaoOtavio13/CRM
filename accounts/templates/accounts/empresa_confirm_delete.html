{% extends 'core/base.html' %}

{% block title %}Excluir empresa | Vendas CRM{% endblock %}

{% block content %}
<div class="card">
	<p class="eyebrow">Exclusao</p>
	<h2>Excluir empresa</h2>
	<p>Tem certeza que deseja excluir <strong>{{ empresa.nome }}</strong>?</p>
	<form method="post">
		{% csrf_token %}
		<div class="actions">
			<button type="submit" class="danger">Confirmar exclusao</button>
			<a class="action-link" href="{% url 'empresa_list' %}">Cancelar</a>
		</div>
	</form>
</div>
{% endblock %}
