<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Detalhe da Venda</title>
</head>
<body>
    <h1>Detalhe da Venda</h1>
    <p><strong>Data:</strong> {{ venda.data_venda }}</p>
    <p><strong>Total:</strong> R$ {{ venda.total }}</p>
    <h2>Itens</h2>
    <ul>
        {% for item in venda.itens.all %}
            <li>{{ item.produto.nome }} - {{ item.quantidade }} unidade(s) - R$ {{ item.subtotal }}</li>
        {% empty %}
            <li>Nenhum item nesta venda.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'vendas_list' %}">Voltar</a>
</body>
</html>
