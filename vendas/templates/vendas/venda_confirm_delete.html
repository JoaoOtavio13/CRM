{% extends 'core/base.html' %}

{% block title %}Excluir venda | Vendas CRM{% endblock %}

{% block content %}
<div class="card">
    <p class="eyebrow">Exclusao</p>
    <h2>Excluir venda</h2>
    <p>Tem certeza que deseja excluir a venda <strong>#{{ venda.numero }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="danger">Confirmar exclusao</button>
            <a class="action-link" href="{% url 'vendas_list' %}">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
