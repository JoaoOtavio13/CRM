<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Vendas</title>
</head>
<body>
    <h1>Vendas</h1>
    <a href="{% url 'registrar_venda' %}">Nova Venda</a>
    <ul>
        {% for venda in vendas %}
            <li>
                <a href="{% url 'venda_detail' venda.pk %}">Venda #{{ venda.pk }}</a>
                - Total: R$ {{ venda.total }}
                - <a href="{% url 'venda_delete' venda.pk %}">Excluir</a>
            </li>
        {% empty %}
            <li>Nenhuma venda registrada.</li>
        {% endfor %}
    </ul>
</body>
</html>
